# RingServer configuration for RUT956
# Ring buffer in /tmp (RAM) — volatile, si azzera al riavvio

RingDirectory   /tmp/ring
RingSize        16777216        # 16 MB ring buffer

DataLinkPort    16000           # Porta DataLink (meda scrive qui)
SeedLinkPort    18000           # Porta SeedLink (client leggono qui)

# Accesso in scrittura (DataLink)
WriteIP         127.0.0.1
WriteIP         ::1
WriteIP         192.168.0.0/8
WriteIP         10.0.0.0/8

ServerID        "MEDA RUT956 RingServer"

# Archivia miniSEED in /tmp/mseed (formato: NET.STA.LOC.CHA.mseed)
MSeedWrite      CHAN@/tmp/mseed
